name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Pages base path
        id: base
        shell: bash
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp build time
        id: stamp
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Fetch comparison refs
        shell: bash
        run: |
          set -euo pipefail
          refs=(
            main
            nightly
            nightly-source
            preview
            dev
            feat/water
            recovery/day-reference
            recovery/gigapixel
            recovery/simulator
          )
          for ref in "${refs[@]}"; do
            git fetch --no-tags origin "refs/heads/${ref}:refs/remotes/origin/${ref}"
          done

      - name: Build stable root from nightly
        shell: bash
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          BUILD_TIME: ${{ steps.stamp.outputs.time }}
        run: |
          set -euo pipefail
          rm -rf pages-root root-src
          mkdir -p pages-root root-src
          git archive origin/nightly | tar -x -C root-src
          ROOT_SHA="$(git rev-parse origin/nightly)"
          (
            cd root-src
            npm ci
            NEXT_PUBLIC_BASE_PATH="$BASE_PATH"             NEXT_PUBLIC_BUILD_SHA="$ROOT_SHA"             NEXT_PUBLIC_BUILD_TIME="$BUILD_TIME"             npm run build
          )
          cp -a root-src/out/. pages-root/

      - name: Build every comparison channel
        shell: bash
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          BUILD_TIME: ${{ steps.stamp.outputs.time }}
        run: |
          set -u
          mkdir -p pages-root/compare
          : > pages-root/compare/builds.tsv

          build_channel() {
            ref="$1"
            slug="$2"
            mode="${3:-normal}"
            dir="channel-$(echo "$slug" | tr '/' '-')"
            target="pages-root/compare/$slug"
            sha="$(git rev-parse "origin/$ref")"
            title="$(git log -1 --format=%s "origin/$ref" | tr '\t\n\r' ' ')"
            channel_base="$BASE_PATH/compare/$slug"

            rm -rf "$dir" "$target"
            mkdir -p "$dir" "$target"
            git archive "origin/$ref" | tar -x -C "$dir"

            if [ "$mode" = "simulator" ]; then
              cat > "$dir/next.config.ts" <<'SIMCONFIG'
          import type { NextConfig } from "next";

          const basePath = process.env.NEXT_PUBLIC_BASE_PATH || "";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
            ...(basePath ? { basePath } : {}),
            transpilePackages: [
              "three",
              "@react-three/fiber",
              "@react-three/drei",
              "@crazygl/hero-scroll-assemble-product",
              "@crazygl/core",
            ],
            allowedDevOrigins: ["127.0.0.1", "localhost"],
            devIndicators: false,
          };

          export default nextConfig;
          SIMCONFIG

              CHANNEL_BASE="$channel_base" python3 - "$dir" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          base = os.environ["CHANNEL_BASE"]
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".js", ".jsx", ".ts", ".tsx"}:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              changed = text.replace('"/robot/', f'"{base}/robot/')
              changed = changed.replace("'/robot/", f"'{base}/robot/")
              if changed != text:
                  path.write_text(changed)
          PY
            fi

            echo "building $ref -> /compare/$slug @ $sha"
            if (
              cd "$dir" &&
              npm ci &&
              NEXT_PUBLIC_BASE_PATH="$channel_base"               NEXT_PUBLIC_BUILD_SHA="$sha"               NEXT_PUBLIC_BUILD_TIME="$BUILD_TIME"               npm run build
            ); then
              cp -a "$dir/out/." "$target/"
              status="ok"
            else
              status="failed"
              cat > "$target/index.html" <<EOF
          <!doctype html>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Quackles comparison build failed</title>
          <style>body{font:16px system-ui;background:#111;color:#eee;padding:24px;max-width:760px;margin:auto}code{word-break:break-all}a{color:#9db5ff}</style>
          <h1>Comparison build failed</h1>
          <p><strong>$ref</strong> did not build in the composite Pages run.</p>
          <p>SHA: <code>$sha</code></p>
          <p>The other comparison branches were still deployed.</p>
          <p><a href="$BASE_PATH/compare/">Back to comparison gallery</a></p>
          EOF
            fi

            printf '%s\t%s\t%s\t%s\t%s\n' "$ref" "$slug" "$sha" "$status" "$title" >> pages-root/compare/builds.tsv
          }

          build_channel main main
          build_channel nightly nightly
          build_channel nightly-source nightly-source
          build_channel preview preview
          build_channel dev dev
          build_channel feat/water water
          build_channel recovery/day-reference day-reference
          build_channel recovery/gigapixel gigapixel
          build_channel recovery/simulator simulator simulator

      - name: Generate comparison gallery and source manifest
        shell: bash
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          BUILD_TIME: ${{ steps.stamp.outputs.time }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          root = Path("pages-root/compare")
          rows = []
          for raw in (root / "builds.tsv").read_text().splitlines():
              ref, slug, sha, status, title = raw.split("\t", 4)
              rows.append({
                  "ref": ref,
                  "slug": slug,
                  "sha": sha,
                  "status": status,
                  "title": title,
                  "url": f"{os.environ['BASE_PATH']}/compare/{slug}/",
              })

          manifest = {
              "generatedAt": os.environ["BUILD_TIME"],
              "publisher": "main/.github/workflows/pages.yml",
              "stableRootRef": "nightly",
              "channels": rows,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2))

          cards = []
          for row in rows:
              status = "✓ build" if row["status"] == "ok" else "✕ build failed"
              cards.append(f"""
              <a class="card" href="{html.escape(row['url'])}">
                <div class="row"><strong>{html.escape(row['ref'])}</strong><span>{status}</span></div>
                <p>{html.escape(row['title'])}</p>
                <code>{html.escape(row['sha'][:12])}</code>
              </a>
              """)

          page = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Quackles branch comparison</title>
            <style>
              :root {{ color-scheme: dark; }}
              * {{ box-sizing: border-box; }}
              body {{ margin:0; background:#0c0d10; color:#f3f3f3; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }}
              main {{ width:min(900px,100%); margin:auto; padding:24px 16px 64px; }}
              h1 {{ font:500 clamp(28px,7vw,52px)/.95 system-ui; letter-spacing:-.04em; margin:8px 0 12px; }}
              .lede {{ color:#b9bcc5; max-width:65ch; margin-bottom:28px; }}
              .grid {{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }}
              .card {{ display:block; color:inherit; text-decoration:none; border:1px solid #2b2e36; padding:16px; min-height:126px; background:#12141a; }}
              .card:hover {{ border-color:#8ba4ff; }}
              .row {{ display:flex; gap:12px; justify-content:space-between; align-items:start; }}
              .row span {{ color:#9da2ad; font-size:11px; white-space:nowrap; }}
              p {{ color:#c7cad1; }}
              code {{ color:#8ba4ff; font-size:11px; }}
              .stable {{ margin:18px 0 28px; }}
              .stable a {{ color:#a9baff; }}
            </style>
          </head>
          <body><main>
            <p>QUACKLES / BRANCH LAB</p>
            <h1>Choose the version that feels right.</h1>
            <p class="lede">Every card is built from the named Git branch in the same Pages deployment. A failed experiment gets a failure page instead of blocking the rest.</p>
            <p class="stable">Current root: <a href="{os.environ['BASE_PATH']}/">nightly</a> · generated {html.escape(os.environ['BUILD_TIME'])}</p>
            <div class="grid">{''.join(cards)}</div>
          </main></body></html>"""
          (root / "index.html").write_text(page)
          PY
          rm -f pages-root/compare/builds.tsv

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - id: deploy
        uses: actions/deploy-pages@v4
