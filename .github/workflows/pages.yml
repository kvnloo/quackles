name: pages

on:
  push:
    # quackles Pages tracks nightly; quackles-nightly only has main.
    branches: [main, nightly]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: [lint, typecheck]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/nightly' ||
      github.repository == 'kvnloo/quackles-nightly'
    runs-on: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Pages base path
        id: base
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp build identity
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ steps.stamp.outputs.time }}
          NEXT_PUBLIC_ASSET_ORIGIN: https://kvnloo.github.io/quackles-assets
      - name: Stage pinned Gigapixel asset pyramid
        env:
          QUACKLES_ASSET_SHA: 5ff80074ffc251fff8bc120c812e2fd8d89fb54b
        run: |
          set -euo pipefail
          rm -rf /tmp/quackles-assets
          git clone --filter=blob:none --no-checkout https://github.com/kvnloo/quackles-assets.git /tmp/quackles-assets
          git -C /tmp/quackles-assets fetch --depth=1 origin "$QUACKLES_ASSET_SHA"
          git -C /tmp/quackles-assets checkout --detach "$QUACKLES_ASSET_SHA"
          test "$(git -C /tmp/quackles-assets rev-parse HEAD)" = "$QUACKLES_ASSET_SHA"
          mkdir -p out/quackles-assets
          cp -a /tmp/quackles-assets/blue out/quackles-assets/
          test -f out/quackles-assets/blue/p0000000/0/0_0.webp
          test -f out/quackles-assets/blue/p0000000/3/0_0.webp
          test "$(find out/quackles-assets/blue/p0000000 -name '*.webp' | wc -l | tr -d ' ')" = "1055"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
