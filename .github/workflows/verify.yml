# Stack verify for Verified OSS Loop claims. Does not deploy Pages.
name: verify

on:
  pull_request:
  push:
    branches: [main, preview, nightly, dev]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
