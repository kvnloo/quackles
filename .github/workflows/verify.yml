# Stack verify for Verified OSS Loop claims. Does not deploy Pages.
name: verify

on:
  pull_request:
  push:
    branches: [main, preview, nightly, dev, reconcile/desktop-contract]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Start static preview
        run: |
          npm run preview > /tmp/quackles-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:43217/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/quackles-preview.log
          exit 1
      - name: Validate desktop cinematic interaction
        run: npm run test:desktop
      - name: Upload desktop validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-${{ github.sha }}
          path: artifacts/desktop-validation
          if-no-files-found: warn
