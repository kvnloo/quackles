name: kick-pages

# Pages is published only by main's pages.yml (/, /nightly/, /preview/<name>/).
# A push here asks it to rebuild so this channel's URL updates.
on:
  push:
    branches: [nightly, dev, "preview/**"]

permissions:
  actions: write
  contents: read

concurrency:
  group: kick-pages
  cancel-in-progress: true

jobs:
  kick:
    if: github.repository == 'kvnloo/quackles'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the single Pages publisher on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
