name: kick-pages-gallery

on:
  push:
    branches:
      - nightly
      - nightly-source
      - preview
      - dev
      - feat/water
      - recovery/**

permissions:
  actions: write
  contents: read

concurrency:
  group: kick-pages-gallery
  cancel-in-progress: true

jobs:
  kick:
    if: github.repository == 'kvnloo/quackles'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the main Pages comparison publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
