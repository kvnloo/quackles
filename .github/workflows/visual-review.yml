name: visual-review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-review.yml"
  workflow_run:
    workflows: ["pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-review-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install crop tooling
        run: python3 -m pip install --quiet pillow

      - name: Checkout Dream Loop critic skill
        uses: actions/checkout@v4
        with:
          repository: kvnloo/dream-loop
          ref: 0dd0547d35ce779d606c4a900b09d1d00c58dd35
          path: dream-loop-critic

      - name: Fetch deployed manifest
        env:
          MANIFEST_URL: https://kvnloo.github.io/quackles/compare/manifest.json
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$MANIFEST_URL" -o /tmp/quackles-manifest.json; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Recover locked Day reference if present on git
        shell: bash
        run: |
          set -u
          mkdir -p review/reference
          refs=(recovery/day-reference nightly-source nightly main)
          paths=(
            blender/assets/reference_day.png
            blender/assets/reference_day.webp
            calibration/references/day.png
            calibration/references/day.webp
          )
          found=0
          for ref in "${refs[@]}"; do
            git fetch --no-tags origin "refs/heads/${ref}:refs/remotes/origin/${ref}" 2>/dev/null || true
            for path in "${paths[@]}"; do
              if git cat-file -e "origin/${ref}:${path}" 2>/dev/null; then
                ext="${path##*.}"
                git show "origin/${ref}:${path}" > "review/reference/day-reference.${ext}"
                printf 'ref=%s\npath=%s\n' "$ref" "$path" > review/reference/source.txt
                found=1
                break 2
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            cat > review/reference/REFERENCE_MISSING.txt <<'EOF'
          The locked Day reference is not committed on any checked remote branch yet.
          Candidate screenshots and zoom crops are still captured.
          Once reference_day.png/webp is pushed, this workflow will automatically include it.
          EOF
          fi

      - name: Capture every deployed branch
        env:
          CHROME: /usr/bin/google-chrome
          MANIFEST: /tmp/quackles-manifest.json
        run: |
          cat > .quackles-capture-pages.mjs <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";
          import puppeteer from "puppeteer-core";

          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
          const baseOrigin = "https://kvnloo.github.io";
          const out = path.resolve("review/raw");
          fs.mkdirSync(out, { recursive: true });

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME,
            headless: true,
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });

          const usable = manifest.channels.filter((channel) => channel.status === "ok");
          const runSalt = process.env.GITHUB_RUN_ID || "local";
          const ordered = usable.slice().sort((a, b) => {
            const h = (x) => crypto.createHash("sha256").update(runSalt + x.ref).digest("hex");
            return h(a).localeCompare(h(b));
          });
          const labels = new Map(ordered.map((channel, i) => [channel.ref, String.fromCharCode(65 + i)]));

          const mapping = [];
          for (const channel of usable) {
            const label = labels.get(channel.ref);
            const url = new URL(channel.url, baseOrigin).href;
            const dir = path.join(out, label);
            fs.mkdirSync(dir, { recursive: true });

            const page = await browser.newPage();
            await page.setViewport({ width: 430, height: 932, deviceScaleFactor: 3, isMobile: true, hasTouch: true });
            const errors = [];
            page.on("pageerror", (error) => errors.push(String(error)));
            page.on("console", (message) => { if (message.type() === "error") errors.push(message.text()); });

            try {
              await page.goto(url, { waitUntil: "domcontentloaded", timeout: 60000 });
              await page.evaluate(async () => {
                const settle = (async () => {
                  if (document.fonts?.ready) await document.fonts.ready;
                  await Promise.all([...document.images].map((img) => img.decode?.().catch(() => {})));
                })();
                await Promise.race([
                  settle,
                  new Promise((resolve) => setTimeout(resolve, 5000)),
                ]);
              });
              await new Promise((resolve) => setTimeout(resolve, 1500));

              // Preserve the branch's natural first impression, then normalize to Day
              // for reference judging when a Day control/debug surface exists.
              const defaultFrame = await page.$(".poster-frame");
              if (defaultFrame) {
                await defaultFrame.screenshot({ path: path.join(dir, "default-hero-frame.png") });
              } else {
                await page.screenshot({ path: path.join(dir, "default-hero-frame.png"), fullPage: false });
              }

              await page.evaluate(() => {
                const controls = [...document.querySelectorAll("button,[role=radio]")];
                const day = controls.find((node) => {
                  const text = (node.textContent || "").trim().toLowerCase();
                  const aria = (node.getAttribute("aria-label") || "").trim().toLowerCase();
                  return text === "day" || aria === "day";
                });
                if (day instanceof HTMLElement) {
                  day.click();
                  return;
                }
                window.__QUACKLES_SEQUENCE__?.setTheme?.("day");
              });
              await new Promise((resolve) => setTimeout(resolve, 800));

              const maxScroll = await page.evaluate(() => Math.max(1, document.documentElement.scrollHeight - innerHeight));
              for (const [name, p] of [["hero", 0], ["quarter", .25], ["middle", .5], ["three-quarter", .75], ["end", 1]]) {
                await page.evaluate(({ p, maxScroll }) => scrollTo(0, p * maxScroll), { p, maxScroll });
                await new Promise((resolve) => setTimeout(resolve, 450));
                await page.screenshot({ path: path.join(dir, name + "-viewport.png"), fullPage: false });

                if (name === "hero") {
                  const frame = await page.$(".poster-frame");
                  if (frame) {
                    await frame.screenshot({ path: path.join(dir, "hero-frame.png") });
                  } else {
                    await page.screenshot({ path: path.join(dir, "hero-frame.png"), fullPage: false });
                  }
                }
              }

              // Desktop reconciliation branches expose an explicit phase/debug
              // surface. Capture it separately from the 2:3 Day-reference pass:
              // desktop composition is sanity evidence, not a poster crop-gate.
              await page.setViewport({
                width: 1440,
                height: 1000,
                deviceScaleFactor: 1,
                isMobile: false,
                hasTouch: false,
              });
              await page.reload({ waitUntil: "domcontentloaded", timeout: 60000 });
              await page.evaluate(async () => {
                const settle = (async () => {
                  if (document.fonts?.ready) await document.fonts.ready;
                  await Promise.all([...document.images].map((img) => img.decode?.().catch(() => {})));
                })();
                await Promise.race([
                  settle,
                  new Promise((resolve) => setTimeout(resolve, 5000)),
                ]);
              });
              await new Promise((resolve) => setTimeout(resolve, 1200));

              await page.evaluate(() => {
                const controls = [...document.querySelectorAll("button,[role=radio]")];
                const day = controls.find((node) => {
                  const text = (node.textContent || "").trim().toLowerCase();
                  const aria = (node.getAttribute("aria-label") || "").trim().toLowerCase();
                  return text === "day" || aria === "day";
                });
                if (day instanceof HTMLElement) day.click();
                else window.__QUACKLES_SEQUENCE__?.setTheme?.("day");
              });
              await new Promise((resolve) => setTimeout(resolve, 500));

              const hasDesktopController = await page.evaluate(
                () => Boolean(window.__QUACKLES_DESKTOP__?.seekPhase),
              );
              if (hasDesktopController) {
                const desktopShot = async (name) => {
                  await page.screenshot({
                    path: path.join(dir, `desktop-${name}-viewport.png`),
                    fullPage: false,
                  });
                  const frame = await page.$(".poster-frame");
                  if (frame) {
                    await frame.screenshot({
                      path: path.join(dir, `desktop-${name}-frame.png`),
                    });
                  }
                };

                await desktopShot("hero");
                await page.evaluate(() => window.__QUACKLES_DESKTOP__?.setZoomInstant?.(0.72));
                await new Promise((resolve) => setTimeout(resolve, 80));
                await desktopShot("inspect-near");
                await page.evaluate(() => window.__QUACKLES_DESKTOP__?.setZoomInstant?.(1.42));
                await new Promise((resolve) => setTimeout(resolve, 80));
                await desktopShot("inspect-far");

                const liveReady = await page
                  .waitForFunction(
                    () => Boolean(window.__QUACKLES_DEBUG__?.getState?.()?.ready),
                    { timeout: 60000 },
                  )
                  .then(() => true)
                  .catch(() => false);

                if (liveReady) {
                  const checkpoints = [
                    ["jump", 0.58],
                    ["explode", 0.62],
                    ["reassemble", 0.55],
                    ["sim-ready", 1],
                  ];
                  for (const [phase, progress] of checkpoints) {
                    const before = await page.evaluate(
                      () => window.__QUACKLES_DEBUG__?.getState?.()?.renderCount ?? 0,
                    );
                    await page.evaluate(
                      ({ phase, progress }) =>
                        window.__QUACKLES_DESKTOP__?.seekPhase?.(phase, progress),
                      { phase, progress },
                    );
                    await page
                      .waitForFunction(
                        (previous) =>
                          (window.__QUACKLES_DEBUG__?.getState?.()?.renderCount ?? 0) >
                          previous,
                        { timeout: 45000 },
                        before,
                      )
                      .catch(() =>
                        errors.push(`desktop ${phase} render did not complete before capture timeout`),
                      );
                    await desktopShot(phase);
                  }
                } else {
                  fs.writeFileSync(
                    path.join(dir, "desktop-live-not-ready.txt"),
                    "Desktop controller mounted, but live rig/set did not reach ready in 60s.\n",
                  );
                }

                const desktopState = await page.evaluate(() => ({
                  desktop: window.__QUACKLES_DESKTOP__?.getState?.() ?? null,
                  probe: window.__QUACKLES_DEBUG__?.getState?.() ?? null,
                  phase: document.querySelector(".desktop-shell")?.getAttribute("data-phase") ?? null,
                  liveReady: document.querySelector(".desktop-shell")?.getAttribute("data-live-ready") ?? null,
                }));
                fs.writeFileSync(
                  path.join(dir, "desktop-state.json"),
                  JSON.stringify(desktopState, null, 2),
                );
              }
            } catch (error) {
              errors.push(error instanceof Error ? error.stack || error.message : String(error));
            }
            fs.writeFileSync(path.join(dir, "browser-errors.txt"), errors.join("\n"));
            mapping.push({ label, ref: channel.ref, sha: channel.sha, url });
            await page.close();
          }

          await browser.close();
          fs.mkdirSync("review/private-map", { recursive: true });
          fs.writeFileSync("review/private-map/blind-map.json", JSON.stringify(mapping, null, 2));
          NODE
          node .quackles-capture-pages.mjs

      - name: Build blind DreamLoop crop pack
        run: |
          cat > /tmp/crops.py <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          import json
          import math

          raw = Path("review/raw")
          blind = Path("review/blind")
          blind.mkdir(parents=True, exist_ok=True)

          crop_defs = {
              "top-layout": (0.00, 0.00, 1.00, 0.36),
              "left-copy": (0.00, 0.05, 0.48, 0.55),
              "robot": (0.16, 0.18, 0.76, 0.76),
              "orb-right": (0.53, 0.12, 1.00, 0.64),
              "plinth": (0.00, 0.48, 1.00, 0.90),
              "bottom": (0.00, 0.72, 1.00, 1.00),
          }

          def crop(img, box):
              w, h = img.size
              x0, y0, x1, y1 = box
              return img.crop((round(x0*w), round(y0*h), round(x1*w), round(y1*h)))

          labels = sorted([p for p in raw.iterdir() if p.is_dir()], key=lambda p: p.name)
          for label_dir in labels:
              target = blind / label_dir.name
              target.mkdir(exist_ok=True)
              for source in label_dir.glob("*.png"):
                  img = Image.open(source).convert("RGB")
                  img = ImageOps.exif_transpose(img)
                  img.save(target / source.name, quality=92)
                  if source.name == "hero-frame.png":
                      for name, box in crop_defs.items():
                          c = crop(img, box)
                          scale = max(1, math.ceil(900 / max(1, c.width)))
                          if scale > 1:
                              c = c.resize((c.width*scale, c.height*scale), Image.Resampling.LANCZOS)
                          c.save(target / f"zoom-{name}.jpg", quality=94)
                  elif source.name.startswith("desktop-") and source.name.endswith("-frame.png"):
                      desktop_crops = {
                          "left": (0.00, 0.02, 0.52, 0.82),
                          "center": (0.20, 0.06, 0.80, 0.86),
                          "right": (0.48, 0.02, 1.00, 0.82),
                          "lower": (0.12, 0.42, 0.88, 1.00),
                      }
                      for name, box in desktop_crops.items():
                          c = crop(img, box)
                          scale = max(1, math.ceil(900 / max(1, c.width)))
                          if scale > 1:
                              c = c.resize((c.width*scale, c.height*scale), Image.Resampling.LANCZOS)
                          c.save(target / f"{source.stem}-zoom-{name}.jpg", quality=94)

          ref_dir = Path("review/reference")
          refs = list(ref_dir.glob("day-reference.*"))
          if refs:
              ref = Image.open(refs[0]).convert("RGB")
              ref = ImageOps.exif_transpose(ref)
              out = blind / "REFERENCE"
              out.mkdir(exist_ok=True)
              ref.save(out / "day-reference.png")
              for name, box in crop_defs.items():
                  c = crop(ref, box)
                  scale = max(1, math.ceil(900 / max(1, c.width)))
                  if scale > 1:
                      c = c.resize((c.width*scale, c.height*scale), Image.Resampling.LANCZOS)
                  c.save(out / f"zoom-{name}.jpg", quality=94)

          instructions = """# Blind Quackles visual review

          You are an independent fresh-context reviewer.

          Inputs are intentionally limited to the locked reference image, anonymous letter-coded candidate images, and this neutral rubric.

          Do NOT inspect:
          - branch mappings
          - source code or scene files
          - commit history
          - builder notes
          - prior reviewer reports
          - implementation claims

          Review full-resolution images and the zoom/detail crops. Do not judge from thumbnails.

          For each anonymous candidate, return exactly one verdict:
          - PASS
          - FAIL
          - INSUFFICIENT EVIDENCE

          Then list specific observed mismatches only.

          DreamLoop critic pass:
          1. Judge the whole hero frame first.
          2. Inspect every zoom-* crop independently.
          3. Compare camera/composition, architecture/layout, robot identity/anatomy/pose, props, materials, environmental detail, lighting, color, orb/reflections, plinth treatment and typography.
          4. Do not infer candidate identity or reward novelty.
          5. For mobile/sequence motion, inspect hero / quarter / middle / three-quarter / end viewport captures in order and call out pose discontinuity, temporal popping, incoherent choreography or reverse-state problems visible in the evidence.
          6. When desktop-* checkpoints exist, inspect INSPECT near/far plus JUMP / EXPLODE / REASSEMBLE / SIM READY and every desktop crop. These are blind sanity evidence, not direct 2:3 Day-reference scores. Check camera tracking, robot identity/proportions, crossfade discontinuity, exploded-part coherence, reassembly, and handoff continuity.
          7. Record blockers before preferences.
          8. If the locked reference is missing or the evidence cannot support a claim, use INSUFFICIENT EVIDENCE instead of guessing.

          A technically plausible or successful build is not automatically a visual PASS.
          """
          (blind / "REVIEW.md").write_text(instructions)
          PY
          python3 /tmp/crops.py

      - name: Run real Dream Loop overlays and crop gates
        shell: bash
        run: |
          set -u
          mkdir -p review/blind/DREAMLOOP
          cp dream-loop-critic/references/classic/judge.md review/blind/DREAMLOOP/JUDGE.md
          cp dream-loop-critic/references/pro-mode/workflow.md review/blind/DREAMLOOP/WORKFLOW.md

          REF="$(find review/reference -maxdepth 1 -type f -name 'day-reference.*' | head -n 1 || true)"
          if [ -z "$REF" ]; then
            cat > review/blind/DREAMLOOP/REFERENCE_MISSING.txt <<'EOF'
          The locked Day reference is not on a checked remote branch yet.
          Candidate screenshots and zoom crops are still blind-ready.
          Once the reference is pushed, this workflow will run the actual Dream Loop
          overlay.py + crop_gate.py on the full hero and every focused crop.
          EOF
            exit 0
          fi

          for candidate in review/blind/[A-Z]; do
            [ -d "$candidate" ] || continue
            hero="$candidate/hero-frame.png"
            [ -f "$hero" ] || continue

            full="$candidate/dreamloop-full"
            mkdir -p "$full"
            python3 dream-loop-critic/scripts/overlay.py "$REF" "$hero" "$full" || true
            set +e
            python3 dream-loop-critic/scripts/crop_gate.py "$REF" "$hero" "$full" > "$full/crop-gate.txt" 2>&1
            rc=$?
            set -e
            printf 'exit_code=%s\n' "$rc" >> "$full/crop-gate.txt"

            for ref_crop in review/blind/REFERENCE/zoom-*.jpg; do
              [ -f "$ref_crop" ] || continue
              name="$(basename "$ref_crop")"
              candidate_crop="$candidate/$name"
              [ -f "$candidate_crop" ] || continue
              region="$candidate/dreamloop-$(basename "$name" .jpg)"
              mkdir -p "$region"
              python3 dream-loop-critic/scripts/overlay.py "$ref_crop" "$candidate_crop" "$region" || true
              set +e
              python3 dream-loop-critic/scripts/crop_gate.py "$ref_crop" "$candidate_crop" "$region" > "$region/crop-gate.txt" 2>&1
              rc=$?
              set -e
              printf 'exit_code=%s\n' "$rc" >> "$region/crop-gate.txt"
            done
          done

      - name: Upload blind review pack
        uses: actions/upload-artifact@v4
        with:
          name: quackles-blind-review-${{ github.run_id }}
          path: review/blind/
          retention-days: 30

      - name: Upload private branch map
        uses: actions/upload-artifact@v4
        with:
          name: quackles-blind-map-${{ github.run_id }}
          path: review/private-map/
          retention-days: 30
